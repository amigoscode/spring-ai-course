# Maintainers only. Runs when the solution branch changes:
#   1. every module's solution must pass its tests
#   2. the student version is generated from it
#   3. the student version must compile, and its task tests must fail
#   4. the student version is committed to main
name: Publish tasks

on:
  push:
    branches: [solution]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tasks
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository_owner == 'amigoscode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: solution
          path: solution

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Solution tests pass
        working-directory: solution
        run: |
          for module in [0-9][0-9]-*/; do
            echo "::group::$module"
            (cd "$module" && ./mvnw -B -q verify)
            echo "::endgroup::"
          done

      - name: Generate the student version
        run: python3 solution/scripts/generate_tasks.py solution main

      - name: Student version compiles and its tests fail
        working-directory: main
        run: |
          for module in [0-9][0-9]-*/; do
            echo "::group::$module"
            (cd "$module" && ./mvnw -B -q test-compile)
            if (cd "$module" && ./mvnw -B -q test > /dev/null 2>&1); then
              echo "::error::$module tests pass without the solution. Is an answer left in the starter code?"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Commit to main
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "main is already up to date"
          else
            git commit -m "Update tasks from solution ${GITHUB_SHA::7}"
            git push origin main
          fi
