spring.application.name=production

# Reads DEEPSEEK_API_KEY from a .env file in this module or in the repo root.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.model=deepseek-v4-flash

# Hides a harmless Netty DNS warning on macOS.
logging.level.io.netty.resolver.dns.DnsServerAddressStreamProviders=off

# Create the SPRING_AI_CHAT_MEMORY table on startup. The default only does it for embedded databases.
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# Create the vector_store table (and the vector extension) on startup.
spring.ai.vectorstore.pgvector.initialize-schema=true
# Keep the downloaded ONNX model between runs, instead of in a temp folder.
spring.ai.embedding.transformer.cache.directory=${user.home}/.cache/spring-ai-onnx

# The MCP server is at http://localhost:8080/mcp (Streamable HTTP).
# Set the protocol explicitly: without it Spring AI 2.0 falls back to the deprecated SSE transport.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=amigos-books
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Tools and documents of Amigos Books, an online bookstore for developers. Use them to check stock, find books by topic and answer questions about shipping, returns, payments and the loyalty programme.

# The MCP client is off by default. Run with --spring.profiles.active=deepwiki to turn it on.
spring.ai.mcp.client.enabled=false

# TODO task-3: retry DeepSeek at most 3 times, starting at 500ms, doubling, at most 5s

# Metrics at /actuator/metrics (admin only). Spring AI publishes token usage and latency.
management.endpoints.web.exposure.include=health,metrics
# Prompts and answers can contain personal data. Keep them out of traces and logs (the default).
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
