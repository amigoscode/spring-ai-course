# Bonus: the app as an MCP CLIENT, using DeepWiki's public MCP server
# (questions about any public GitHub repository, no sign up needed).
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=amigos-books
spring.ai.mcp.client.streamable-http.connections.deepwiki.url=https://mcp.deepwiki.com
spring.ai.mcp.client.streamable-http.connections.deepwiki.endpoint=/mcp
